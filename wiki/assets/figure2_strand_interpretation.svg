<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4D4D4D"/></marker>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#272727}.subtitle{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#666666}.panel{fill:#FFFFFF;stroke:#D5D9DF;stroke-width:2}.blue{fill:#EEF4FB;stroke:#8BB2D9;stroke-width:2}.green{fill:#F0F6EF;stroke:#9DBE99;stroke-width:2}.label{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#272727}.body{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#4D4D4D}.small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#666666}.seq{font-family:Courier New,monospace;font-size:25px;font-weight:700;fill:#272727}.red{fill:#B64342}.deepblue{fill:#0F4D92}.line{stroke:#767676;stroke-width:4}.arrow{stroke:#4D4D4D;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.callout{fill:#FFF7E8;stroke:#D6A955;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="620" fill="#FFFFFF"/>
  <text class="title" x="60" y="60">Strand-aware C-to-U interpretation</text>
  <text class="subtitle" x="60" y="90">Transcript-level C-to-U editing appears differently in genomic coordinates on opposite strands</text>

  <rect class="panel" x="60" y="125" width="610" height="400" rx="18"/>
  <rect class="blue" x="85" y="150" width="560" height="350" rx="16"/>
  <text class="label" x="115" y="195">Positive-strand transcript</text>
  <text class="small" x="115" y="225">Transcript and genomic reference share the same orientation</text>
  <text class="body" x="115" y="280">Genomic reference</text>
  <line class="line" x1="300" y1="275" x2="590" y2="275"/>
  <text class="seq" x="330" y="266">A G</text><text class="seq red" x="405" y="266">C</text><text class="seq" x="430" y="266">A T G C</text>
  <path class="arrow" d="M445 310 V350"/>
  <text class="body" x="115" y="385">RNA after editing</text>
  <line class="line" x1="300" y1="380" x2="590" y2="380"/>
  <text class="seq deepblue" x="330" y="371">A G</text><text class="seq red" x="405" y="371">U</text><text class="seq deepblue" x="430" y="371">A U G C</text>
  <rect class="callout" x="230" y="425" width="290" height="52" rx="10"/>
  <text class="label" x="375" y="459" text-anchor="middle">Genomic C to T</text>

  <rect class="panel" x="730" y="125" width="610" height="400" rx="18"/>
  <rect class="green" x="755" y="150" width="560" height="350" rx="16"/>
  <text class="label" x="785" y="195">Negative-strand transcript</text>
  <text class="small" x="785" y="225">Transcript is the reverse complement of the genomic reference</text>
  <text class="body" x="785" y="280">Genomic reference</text>
  <line class="line" x1="970" y1="275" x2="1260" y2="275"/>
  <text class="seq" x="1000" y="266">T C</text><text class="seq red" x="1075" y="266">G</text><text class="seq" x="1100" y="266">T A C G</text>
  <path class="arrow" d="M1115 310 V350"/>
  <text class="body" x="785" y="385">Transcript-oriented RNA</text>
  <line class="line" x1="970" y1="380" x2="1260" y2="380"/>
  <text class="seq deepblue" x="1000" y="371">C G U A</text><text class="seq red" x="1125" y="371">U</text><text class="seq deepblue" x="1150" y="371">G A</text>
  <rect class="callout" x="900" y="425" width="290" height="52" rx="10"/>
  <text class="label" x="1045" y="459" text-anchor="middle">Genomic G to A</text>

  <rect class="callout" x="300" y="550" width="800" height="48" rx="10"/>
  <text class="body" x="700" y="580" text-anchor="middle">ORCA uses VEP strand annotation to map both patterns to transcript-level C-to-U editing</text>
</svg>

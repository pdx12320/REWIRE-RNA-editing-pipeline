<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
  <rect width="1500" height="560" fill="#F8FBFC"/>
  <text x="750" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#183B4E">Why depth must be checked in every sample</text>

  <rect x="60" y="110" width="420" height="350" rx="24" fill="#EAF8EE" stroke="#2D5E73" stroke-width="3"/>
  <text x="270" y="155" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#183B4E">Covered control</text>
  <text x="270" y="225" text-anchor="middle" font-family="Arial" font-size="20" fill="#334E5C">Treated: called, depth 120</text>
  <text x="270" y="270" text-anchor="middle" font-family="Arial" font-size="20" fill="#334E5C">Control: not called, depth 130</text>
  <line x1="110" y1="310" x2="430" y2="310" stroke="#9CB4C1" stroke-width="2"/>
  <text x="270" y="360" text-anchor="middle" font-family="Arial" font-size="19" fill="#155D3D">The control is informative.</text>
  <text x="270" y="400" text-anchor="middle" font-family="Arial" font-size="17" fill="#516B78">Continue to replicate filtering.</text>

  <rect x="540" y="110" width="420" height="350" rx="24" fill="#FFF7E5" stroke="#2D5E73" stroke-width="3"/>
  <text x="750" y="155" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#183B4E">Uncovered control</text>
  <text x="750" y="225" text-anchor="middle" font-family="Arial" font-size="20" fill="#334E5C">Treated: called, depth 120</text>
  <text x="750" y="270" text-anchor="middle" font-family="Arial" font-size="20" fill="#334E5C">Control: not called, depth 0</text>
  <line x1="590" y1="310" x2="910" y2="310" stroke="#9CB4C1" stroke-width="2"/>
  <text x="750" y="360" text-anchor="middle" font-family="Arial" font-size="19" fill="#8A5B00">The control is not informative.</text>
  <text x="750" y="400" text-anchor="middle" font-family="Arial" font-size="17" fill="#516B78">The site fails the depth requirement.</text>

  <rect x="1020" y="110" width="420" height="350" rx="24" fill="#FFF0F1" stroke="#2D5E73" stroke-width="3"/>
  <text x="1230" y="155" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#183B4E">Single treated call</text>
  <text x="1230" y="220" text-anchor="middle" font-family="Arial" font-size="20" fill="#334E5C">T1: called</text>
  <text x="1230" y="260" text-anchor="middle" font-family="Arial" font-size="20" fill="#334E5C">T2: not called</text>
  <text x="1230" y="300" text-anchor="middle" font-family="Arial" font-size="20" fill="#334E5C">T3: not called</text>
  <line x1="1070" y1="330" x2="1390" y2="330" stroke="#9CB4C1" stroke-width="2"/>
  <text x="1230" y="380" text-anchor="middle" font-family="Arial" font-size="19" fill="#8B2F38">The signal is not reproducible.</text>
  <text x="1230" y="420" text-anchor="middle" font-family="Arial" font-size="17" fill="#516B78">Default rule: support in all treated samples.</text>

  <text x="750" y="520" text-anchor="middle" font-family="Arial" font-size="18" fill="#516B78">A missing REDItools2 call is interpreted together with independent candidate-site depth.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520" role="img" aria-labelledby="title desc">
  <title id="title">Model 1 RNA-editing evidence workflow</title>
  <desc id="desc">Six RNA-seq libraries are aligned, processed, analyzed with REDItools2, annotated for transcript strand, checked across all samples, and converted into candidates for validation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3A556A"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#183B4E}
      .label{font:700 20px Arial,sans-serif;fill:#183B4E;text-anchor:middle}
      .sub{font:400 15px Arial,sans-serif;fill:#405968;text-anchor:middle}
      .box{stroke:#29586E;stroke-width:2.5;rx:22;ry:22}
      .arrow{stroke:#3A556A;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="520" fill="#F7FAFC"/>
  <text x="900" y="58" class="title" text-anchor="middle">Model 1 — From RNA-seq to reproducible editing evidence</text>

  <rect x="35" y="145" width="205" height="210" class="box" fill="#EAF5FF"/>
  <text x="137" y="192" class="label">6 RNA-seq libraries</text>
  <text x="137" y="230" class="sub">T1 · T2 · T3</text>
  <text x="137" y="258" class="sub">C1 · C2 · C3</text>
  <text x="137" y="306" class="sub">paired-end reads</text>

  <rect x="285" y="145" width="205" height="210" class="box" fill="#E8F7F0"/>
  <text x="388" y="198" class="label">Map</text>
  <text x="388" y="238" class="sub">STAR two-pass</text>
  <text x="388" y="268" class="sub">GRCh38</text>
  <text x="388" y="308" class="sub">sorted BAM</text>

  <rect x="535" y="145" width="205" height="210" class="box" fill="#FFF5DF"/>
  <text x="638" y="198" class="label">Prepare</text>
  <text x="638" y="238" class="sub">read groups</text>
  <text x="638" y="268" class="sub">MarkDuplicates</text>
  <text x="638" y="298" class="sub">SplitNCigarReads</text>

  <rect x="785" y="145" width="205" height="210" class="box" fill="#F4ECFF"/>
  <text x="888" y="198" class="label">Call</text>
  <text x="888" y="238" class="sub">coverage-aware</text>
  <text x="888" y="268" class="sub">MPI REDItools2</text>
  <text x="888" y="308" class="sub">sample tables</text>

  <rect x="1035" y="145" width="205" height="210" class="box" fill="#FFEDEF"/>
  <text x="1138" y="198" class="label">Orient</text>
  <text x="1138" y="238" class="sub">union VCF</text>
  <text x="1138" y="268" class="sub">VEP strand</text>
  <text x="1138" y="308" class="sub">C→T / G→A</text>

  <rect x="1285" y="145" width="205" height="210" class="box" fill="#EAF3F7"/>
  <text x="1388" y="198" class="label">Compare</text>
  <text x="1388" y="238" class="sub">all-sample depth</text>
  <text x="1388" y="268" class="sub">treated vs control</text>
  <text x="1388" y="308" class="sub">evidence matrix</text>

  <rect x="1535" y="145" width="230" height="210" class="box" fill="#E7F8E7"/>
  <text x="1650" y="198" class="label">Validate</text>
  <text x="1650" y="238" class="sub">rank candidates</text>
  <text x="1650" y="268" class="sub">targeted assays</text>
  <text x="1650" y="308" class="sub">future model labels</text>

  <path d="M240 250 H280" class="arrow"/>
  <path d="M490 250 H530" class="arrow"/>
  <path d="M740 250 H780" class="arrow"/>
  <path d="M990 250 H1030" class="arrow"/>
  <path d="M1240 250 H1280" class="arrow"/>
  <path d="M1490 250 H1530" class="arrow"/>

  <text x="900" y="430" class="sub">Each stage keeps its own files, checks, and logs so that every final candidate can be traced back to the raw data.</text>
</svg>

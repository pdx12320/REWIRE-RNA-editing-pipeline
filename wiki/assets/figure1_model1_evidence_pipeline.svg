<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RNA-editing evidence generation pipeline</title>
  <desc id="desc">Three-panel workflow showing RNA-seq evidence generation, HEK293 Genome Project catalogue harmonization and exact-allele integration.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4D4D4D"/></marker>
    <style>
      .panel{fill:#FFFFFF;stroke:#D5D9DF;stroke-width:2}.rna{fill:#EEF4FB;stroke:#8BB2D9;stroke-width:2}.catalogue{fill:#F0F6EF;stroke:#9DBE99;stroke-width:2}.final{fill:#FFF7E8;stroke:#D6A955;stroke-width:2.2}.node{fill:#FFFFFF;stroke:#C3C9D1;stroke-width:1.7}.node-rna{fill:#FFFFFF;stroke:#6E9FCB;stroke-width:1.8}.node-cat{fill:#FFFFFF;stroke:#7FA579;stroke-width:1.8}.label{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#272727}.body{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#4D4D4D}.small{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:400;fill:#666666}.panel-letter{font-family:Arial,Helvetica,sans-serif;font-size:26px;font-weight:700;fill:#272727}.panel-title{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#272727}.arrow{stroke:#4D4D4D;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.merge{stroke:#777777;stroke-width:2.2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}.rule{stroke:#D5D9DF;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <rect class="panel" x="45" y="45" width="1010" height="585" rx="18"/>
  <text class="panel-letter" x="70" y="83">a</text>
  <text class="panel-title" x="110" y="82">RNA-seq evidence branch</text>
  <text class="small" x="110" y="108">Three treated libraries and three controls analysed independently</text>
  <rect class="rna" x="80" y="150" width="940" height="420" rx="18"/>

  <rect class="node-rna" x="105" y="190" width="150" height="90" rx="12"/>
  <text class="label" x="180" y="225" text-anchor="middle">SRA Toolkit</text><text class="body" x="180" y="251" text-anchor="middle">paired FASTQ</text>
  <path class="arrow" d="M255 235 H300"/>
  <rect class="node-rna" x="300" y="190" width="150" height="90" rx="12"/>
  <text class="label" x="375" y="225" text-anchor="middle">STAR</text><text class="body" x="375" y="251" text-anchor="middle">two-pass alignment</text>
  <path class="arrow" d="M450 235 H495"/>
  <rect class="node-rna" x="495" y="190" width="165" height="90" rx="12"/>
  <text class="label" x="577.5" y="225" text-anchor="middle">GATK</text><text class="body" x="577.5" y="249" text-anchor="middle">duplicate marking</text><text class="small" x="577.5" y="268" text-anchor="middle">SplitNCigarReads</text>
  <path class="arrow" d="M660 235 H705"/>
  <rect class="node-rna" x="705" y="190" width="180" height="90" rx="12"/>
  <text class="label" x="795" y="225" text-anchor="middle">REDItools2</text><text class="body" x="795" y="249" text-anchor="middle">coverage-balanced</text><text class="small" x="795" y="268" text-anchor="middle">MPI calling</text>
  <path class="arrow" d="M885 235 H930"/>
  <rect class="node-rna" x="930" y="190" width="65" height="90" rx="12"/>
  <text class="label" x="962.5" y="225" text-anchor="middle">VCF</text><text class="small" x="962.5" y="251" text-anchor="middle">union</text>

  <path class="arrow" d="M962.5 280 V335"/>
  <rect class="node-rna" x="790" y="335" width="205" height="90" rx="12"/>
  <text class="label" x="892.5" y="370" text-anchor="middle">VEP</text><text class="body" x="892.5" y="395" text-anchor="middle">transcript orientation</text>
  <path class="arrow" d="M790 380 H730"/>
  <rect class="node-rna" x="500" y="335" width="230" height="90" rx="12"/>
  <text class="label" x="615" y="370" text-anchor="middle">Candidate-site depth</text><text class="body" x="615" y="395" text-anchor="middle">all six BAM files</text>
  <path class="arrow" d="M500 380 H440"/>
  <rect class="node-rna" x="105" y="335" width="335" height="90" rx="12"/>
  <text class="label" x="272.5" y="370" text-anchor="middle">Replicate and control evidence</text><text class="body" x="272.5" y="395" text-anchor="middle">3/3 treated; 0/3 control; depth qualified</text>

  <line class="rule" x1="105" y1="465" x2="995" y2="465"/>
  <text class="small" x="105" y="500">Transcript-level interpretation</text>
  <text class="body" x="105" y="528">positive strand: genomic C→T</text>
  <text class="body" x="385" y="528">negative strand: genomic G→A</text>
  <text class="small" x="735" y="528">not called ≠ not observed</text>

  <rect class="panel" x="1090" y="45" width="465" height="585" rx="18"/>
  <text class="panel-letter" x="1115" y="83">b</text>
  <text class="panel-title" x="1155" y="82">293T genomic catalogue branch</text>
  <text class="small" x="1155" y="108">HEK293 Genome Project; external evidence</text>
  <rect class="catalogue" x="1125" y="150" width="395" height="420" rx="18"/>

  <rect class="node-cat" x="1160" y="175" width="325" height="76" rx="12"/>
  <text class="label" x="1322.5" y="206" text-anchor="middle">293T_CG VCF</text><text class="small" x="1322.5" y="231" text-anchor="middle">Complete Genomics; build36 / hg18</text>
  <path class="arrow" d="M1322.5 251 V278"/>
  <rect class="node-cat" x="1160" y="278" width="325" height="76" rx="12"/>
  <text class="label" x="1322.5" y="309" text-anchor="middle">Source filtering</text><text class="small" x="1322.5" y="334" text-anchor="middle">PASS biallelic SNPs; alternate genotype</text>
  <path class="arrow" d="M1322.5 354 V381"/>
  <rect class="node-cat" x="1160" y="381" width="325" height="76" rx="12"/>
  <text class="label" x="1322.5" y="412" text-anchor="middle">CrossMap</text><text class="small" x="1322.5" y="437" text-anchor="middle">hg18 → GRCh38 with UCSC chain</text>
  <path class="arrow" d="M1322.5 457 V484"/>
  <rect class="node-cat" x="1160" y="484" width="325" height="76" rx="12"/>
  <text class="label" x="1322.5" y="515" text-anchor="middle">bcftools validation</text><text class="small" x="1322.5" y="538" text-anchor="middle">REF check, normalize, sort and index</text><text class="small" x="1322.5" y="554" text-anchor="middle">2,885,725 GRCh38 SNPs</text>

  <rect class="panel" x="45" y="665" width="1510" height="190" rx="18"/>
  <text class="panel-letter" x="70" y="703">c</text>
  <text class="panel-title" x="110" y="702">Evidence integration</text>
  <rect class="node" x="135" y="735" width="390" height="82" rx="12"/>
  <text class="label" x="330" y="768" text-anchor="middle">RNA evidence matrix</text><text class="small" x="330" y="792" text-anchor="middle">replicate, control, depth, strand and allele counts</text>
  <path class="arrow" d="M525 776 H615"/>
  <rect class="node" x="615" y="735" width="310" height="82" rx="12"/>
  <text class="label" x="770" y="768" text-anchor="middle">Exact-allele join</text><text class="small" x="770" y="792" text-anchor="middle">CHROM : POS : REF : ALT</text>
  <path class="arrow" d="M925 776 H1015"/>
  <rect class="final" x="1015" y="735" width="405" height="82" rx="12"/>
  <text class="label" x="1217.5" y="768" text-anchor="middle">Treatment-associated C-to-U candidates</text><text class="small" x="1217.5" y="792" text-anchor="middle">catalogue-filtered and ranked for validation</text>

  <path class="merge" d="M520 570 C520 635 330 650 330 735"/>
  <path class="merge" d="M1322.5 560 C1322.5 640 770 650 770 735"/>
</svg>

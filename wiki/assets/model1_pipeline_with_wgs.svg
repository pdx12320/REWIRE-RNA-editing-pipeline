<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Figure 1. RNA-editing evidence generation pipeline</title>
  <desc id="desc">Two coordinated branches process RNA-seq and public HEK293T WGS data before converging into a treatment-associated RNA-editing evidence matrix.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#354052"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172033}.subtitle{font:400 18px Arial,sans-serif;fill:#526074}.branch{font:700 23px Arial,sans-serif}.boxTitle{font:700 18px Arial,sans-serif;fill:#172033}.body{font:400 15px Arial,sans-serif;fill:#3f4b5f}.small{font:400 13px Arial,sans-serif;fill:#5e697a}.arrow{stroke:#354052;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#8691a2;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="920" fill="#f7f9fc"/>
  <text x="800" y="55" text-anchor="middle" class="title">RNA-editing evidence generation pipeline</text>
  <text x="800" y="86" text-anchor="middle" class="subtitle">Replicate-aware RNA evidence combined with an external HEK293T genomic-variant blacklist</text>

  <rect x="55" y="120" width="990" height="620" rx="26" fill="#eef6ff" stroke="#a8c8ef" stroke-width="2"/>
  <text x="85" y="160" class="branch" fill="#1767a7">RNA-seq evidence branch</text>
  <text x="85" y="186" class="small">3 treated libraries + 3 matched control libraries</text>

  <g><rect x="85" y="225" width="180" height="108" rx="16" fill="#fff" stroke="#76a9dc"/><text x="175" y="258" text-anchor="middle" class="boxTitle">SRA Toolkit</text><text x="175" y="284" text-anchor="middle" class="body">download and FASTQ</text><text x="175" y="306" text-anchor="middle" class="body">conversion</text></g>
  <path class="arrow" d="M265 279 H315"/>
  <g><rect x="315" y="225" width="180" height="108" rx="16" fill="#fff" stroke="#76a9dc"/><text x="405" y="258" text-anchor="middle" class="boxTitle">STAR</text><text x="405" y="284" text-anchor="middle" class="body">two-pass splice-aware</text><text x="405" y="306" text-anchor="middle" class="body">GRCh38 alignment</text></g>
  <path class="arrow" d="M495 279 H545"/>
  <g><rect x="545" y="225" width="190" height="108" rx="16" fill="#fff" stroke="#76a9dc"/><text x="640" y="258" text-anchor="middle" class="boxTitle">GATK</text><text x="640" y="284" text-anchor="middle" class="body">MarkDuplicates</text><text x="640" y="306" text-anchor="middle" class="body">SplitNCigarReads</text></g>
  <path class="arrow" d="M735 279 H785"/>
  <g><rect x="785" y="225" width="220" height="108" rx="16" fill="#fff" stroke="#76a9dc"/><text x="895" y="258" text-anchor="middle" class="boxTitle">REDItools2 + MPI</text><text x="895" y="284" text-anchor="middle" class="body">coverage-balanced</text><text x="895" y="306" text-anchor="middle" class="body">substitution discovery</text></g>

  <path class="arrow" d="M895 333 V392"/>
  <g><rect x="760" y="392" width="270" height="112" rx="16" fill="#fff" stroke="#76a9dc"/><text x="895" y="426" text-anchor="middle" class="boxTitle">VEP strand interpretation</text><text x="895" y="454" text-anchor="middle" class="body">+ strand: genomic C→T</text><text x="895" y="478" text-anchor="middle" class="body">− strand: genomic G→A</text></g>
  <path class="arrow" d="M760 448 H695"/>
  <g><rect x="440" y="392" width="255" height="112" rx="16" fill="#fff" stroke="#76a9dc"/><text x="568" y="426" text-anchor="middle" class="boxTitle">All-sample depth query</text><text x="568" y="454" text-anchor="middle" class="body">baseQ ≥30; mapQ ≥20</text><text x="568" y="478" text-anchor="middle" class="body">distinguish absent vs unobserved</text></g>
  <path class="arrow" d="M440 448 H375"/>
  <g><rect x="85" y="392" width="290" height="112" rx="16" fill="#fff" stroke="#76a9dc"/><text x="230" y="426" text-anchor="middle" class="boxTitle">Control subtraction</text><text x="230" y="454" text-anchor="middle" class="body">3/3 treated reproducibility</text><text x="230" y="478" text-anchor="middle" class="body">0/3 control calls + sufficient depth</text></g>

  <rect x="85" y="560" width="920" height="125" rx="18" fill="#dcecff" stroke="#5b9bd5" stroke-width="2"/>
  <text x="545" y="596" text-anchor="middle" class="boxTitle">RNA evidence matrix</text>
  <text x="545" y="625" text-anchor="middle" class="body">coordinate • transcript orientation • treated/control call status • independent depth</text>
  <text x="545" y="652" text-anchor="middle" class="body">edited-read count • editing fraction • replicate consistency</text>

  <rect x="1090" y="120" width="455" height="620" rx="26" fill="#f2f8ef" stroke="#a5c894" stroke-width="2"/>
  <text x="1120" y="160" class="branch" fill="#397a2e">Public HEK293T WGS branch</text>
  <text x="1120" y="186" class="small">SRR37832939 • SRR37832940 • SRR37832941</text>

  <g><rect x="1120" y="225" width="395" height="88" rx="16" fill="#fff" stroke="#86b875"/><text x="1318" y="257" text-anchor="middle" class="boxTitle">Metadata decision</text><text x="1318" y="278" text-anchor="middle" class="body">same BioSample: merge</text><text x="1318" y="299" text-anchor="middle" class="body">different BioSamples: 2-of-3 consensus</text></g>
  <path class="arrow" d="M1318 313 V350"/>
  <g><rect x="1120" y="350" width="395" height="92" rx="16" fill="#fff" stroke="#86b875"/><text x="1318" y="382" text-anchor="middle" class="boxTitle">BWA-MEM2 / BWA-MEM</text><text x="1318" y="408" text-anchor="middle" class="body">align WGS reads to the same GRCh38 FASTA</text></g>
  <path class="arrow" d="M1318 442 V479"/>
  <g><rect x="1120" y="479" width="395" height="92" rx="16" fill="#fff" stroke="#86b875"/><text x="1318" y="511" text-anchor="middle" class="boxTitle">GATK + bcftools</text><text x="1318" y="537" text-anchor="middle" class="body">duplicate marking • mpileup • SNV calling • normalization</text></g>
  <path class="arrow" d="M1318 571 V608"/>
  <g><rect x="1120" y="608" width="395" height="92" rx="16" fill="#fff" stroke="#86b875"/><text x="1318" y="640" text-anchor="middle" class="boxTitle">External SNV blacklist</text><text x="1318" y="666" text-anchor="middle" class="body">merged call set or exact-allele 2-of-3 consensus</text></g>

  <path class="dash" d="M1120 654 C1055 654 1030 623 1005 623"/>

  <g><rect x="380" y="785" width="840" height="92" rx="22" fill="#fff4dc" stroke="#d5a33e" stroke-width="2"/><text x="800" y="820" text-anchor="middle" class="boxTitle">Treatment-associated RNA-editing candidates</text><text x="800" y="848" text-anchor="middle" class="body">replicate-supported • control-informed • depth-qualified • strand-consistent • externally SNV-filtered</text></g>
  <path class="arrow" d="M545 685 C545 745 680 750 710 785"/>
  <path class="arrow" d="M1318 700 C1318 755 1090 760 1010 785"/>
  <text x="800" y="907" text-anchor="middle" class="small">Public HEK293T WGS is an external blacklist, not WGS matched to the exact experimental cell batch.</text>
</svg>

name: LAMAR label tests

on:
  push:
    paths:
      - "pipeline/scripts/rna/build_lamar_training_table.py"
      - "pipeline/scripts/rna/run_audited_lamar_background_correction.py"
      - "tests/test_lamar_training_label_statistics.py"
      - "tests/test_audited_lamar_background_correction.py"
      - ".github/workflows/lamar-label-tests.yml"
  pull_request:
    paths:
      - "pipeline/scripts/rna/build_lamar_training_table.py"
      - "pipeline/scripts/rna/run_audited_lamar_background_correction.py"
      - "tests/test_lamar_training_label_statistics.py"
      - "tests/test_audited_lamar_background_correction.py"
      - ".github/workflows/lamar-label-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

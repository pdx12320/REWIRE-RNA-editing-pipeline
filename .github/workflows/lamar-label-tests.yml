name: LAMAR label tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal test and optional baseline dependencies
        run: python -m pip install "scikit-learn==1.7.*"
      - name: Run unit and synthetic handoff tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile Python sources
        run: python -m compileall pipeline/scripts examples tests
      - name: Validate shell syntax
        run: find pipeline -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n
      - name: Check whitespace errors
        run: git diff --check
      - name: Verify synthetic leakage assertions ran
        run: python -m unittest discover -s tests -p "test_lamar_finetuning_handoff.py" -v

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A556A"/>
    </marker>
  </defs>
  <rect width="1500" height="560" fill="#F8FBFC"/>
  <text x="750" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#183B4E">Design–Build–Test–Learn</text>

  <rect x="70" y="140" width="300" height="270" rx="26" fill="#EAF5FF" stroke="#2D5E73" stroke-width="3"/>
  <text x="220" y="190" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#183B4E">Design</text>
  <text x="220" y="245" text-anchor="middle" font-family="Arial" font-size="18" fill="#516B78">3 treated + 3 controls</text>
  <text x="220" y="280" text-anchor="middle" font-family="Arial" font-size="18" fill="#516B78">replicate consistency</text>
  <text x="220" y="315" text-anchor="middle" font-family="Arial" font-size="18" fill="#516B78">strand and depth rules</text>

  <rect x="430" y="140" width="300" height="270" rx="26" fill="#F4ECFF" stroke="#2D5E73" stroke-width="3"/>
  <text x="580" y="190" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#183B4E">Build</text>
  <text x="580" y="245" text-anchor="middle" font-family="Arial" font-size="18" fill="#516B78">STAR + GATK</text>
  <text x="580" y="280" text-anchor="middle" font-family="Arial" font-size="18" fill="#516B78">MPI REDItools2</text>
  <text x="580" y="315" text-anchor="middle" font-family="Arial" font-size="18" fill="#516B78">VEP + custom filters</text>

  <rect x="790" y="140" width="300" height="270" rx="26" fill="#EAF8EE" stroke="#2D5E73" stroke-width="3"/>
  <text x="940" y="190" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#183B4E">Test</text>
  <text x="940" y="245" text-anchor="middle" font-family="Arial" font-size="18" fill="#516B78">BAM and read groups</text>
  <text x="940" y="280" text-anchor="middle" font-family="Arial" font-size="18" fill="#516B78">coverage and intervals</text>
  <text x="940" y="315" text-anchor="middle" font-family="Arial" font-size="18" fill="#516B78">merge and index integrity</text>

  <rect x="1150" y="140" width="300" height="270" rx="26" fill="#FFF7E5" stroke="#2D5E73" stroke-width="3"/>
  <text x="1300" y="190" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#183B4E">Learn</text>
  <text x="1300" y="245" text-anchor="middle" font-family="Arial" font-size="18" fill="#516B78">absence needs coverage</text>
  <text x="1300" y="280" text-anchor="middle" font-family="Arial" font-size="18" fill="#516B78">strand changes meaning</text>
  <text x="1300" y="315" text-anchor="middle" font-family="Arial" font-size="18" fill="#516B78">contig names must persist</text>

  <path d="M370 275 H420" stroke="#3A556A" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M730 275 H780" stroke="#3A556A" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1090 275 H1140" stroke="#3A556A" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1300 420 C1200 515,300 515,220 420" fill="none" stroke="#3A556A" stroke-width="4" marker-end="url(#arrow)"/>
</svg>

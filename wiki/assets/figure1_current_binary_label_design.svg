<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Current computational positive and strict computational negative label design</title>
  <desc id="desc">Six uniformly processed RNA sequencing BAMs are recounted with one pileup rule. Candidate sites then follow separate evidence gates for computational positives and strict computational negatives. Both classes pass the same variant, orientation, sequence, and low-complexity checks before leakage-aware grouping.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#526B7F"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#173A55" flood-opacity="0.12"/></filter>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:40px;font-weight:700;fill:#12344D}
      .subtitle{font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#526B7F}
      .heading{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700;fill:#12344D}
      .body{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#526B7F}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#526B7F}
      .white{font-family:Arial,Helvetica,sans-serif;fill:#FFFFFF}
      .arrow{stroke:#526B7F;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#F7FAFC"/>
  <text class="title" x="70" y="68">Evidence gates for the current LAMAR binary dataset</text>
  <text class="subtitle" x="70" y="104">Positive and negative labels are measured independently; neither class is defined by absence from the other.</text>

  <g filter="url(#shadow)">
    <rect x="75" y="145" width="410" height="145" rx="20" fill="#FFFFFF" stroke="#9FC0D3" stroke-width="2"/>
    <rect x="595" y="145" width="410" height="145" rx="20" fill="#FFFFFF" stroke="#9FC0D3" stroke-width="2"/>
    <rect x="1115" y="145" width="410" height="145" rx="20" fill="#FFFFFF" stroke="#168983" stroke-width="2.5"/>
  </g>
  <path class="arrow" d="M485 218 H587"/>
  <path class="arrow" d="M1005 218 H1107"/>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <text class="heading" x="280" y="183">Six MarkDuplicates BAMs</text>
    <text class="body" x="280" y="217">3 treated + 3 control</text>
    <text class="small" x="280" y="247">one BAM and index per biological replicate</text>

    <text class="heading" x="800" y="183">One pileup implementation</text>
    <text class="body" x="800" y="217">MAPQ ≥ 30 • base quality ≥ 20</text>
    <text class="small" x="800" y="247">duplicates and disallowed alignments excluded</text>

    <text class="heading" x="1320" y="183">One sequence convention</text>
    <text class="body" x="1320" y="217">transcript-oriented 101-nt context</text>
    <text class="small" x="1320" y="247">C required at zero-based center index 50</text>
  </g>

  <rect x="125" y="330" width="1350" height="90" rx="18" fill="#12344D"/>
  <text x="800" y="364" text-anchor="middle" class="white" font-size="21" font-weight="700">Shared pre-split quality control</text>
  <text x="800" y="395" text-anchor="middle" class="white" font-size="16">deterministic genomic key • valid orientation • complete sequence • no central WGS variant • low-complexity OR filter</text>
  <path class="arrow" d="M800 290 V322"/>
  <path d="M800 420 V455 H405 V477" stroke="#526B7F" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M800 420 V455 H1195 V477" stroke="#526B7F" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="75" y="485" width="660" height="315" rx="24" fill="#FFFFFF" stroke="#D56A32" stroke-width="3"/>
    <rect x="865" y="485" width="660" height="315" rx="24" fill="#FFFFFF" stroke="#168983" stroke-width="3"/>
  </g>

  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="105" y="513" width="600" height="52" rx="14" fill="#FBEADF"/>
    <text x="405" y="546" text-anchor="middle" font-size="24" font-weight="700" fill="#93431B">COMPUTATIONAL POSITIVE PATH</text>
    <text class="body" x="125" y="605">1. Recount every center in the broad called-site matrix</text>
    <text class="body" x="125" y="641">2. Treated group: at least 2 of 3 replicates depth ≥ 20</text>
    <text class="body" x="125" y="677">3. Control group: at least 2 of 3 replicates depth ≥ 20</text>
    <text class="body" x="125" y="713">4. Corrected efficiency &gt; 0.10 and control median ≤ 0.02</text>
    <rect x="215" y="742" width="380" height="42" rx="21" fill="#D56A32"/>
    <text x="405" y="769" text-anchor="middle" class="white" font-size="20" font-weight="700">1,513 computational positives</text>

    <rect x="895" y="513" width="600" height="52" rx="14" fill="#E3F2EE"/>
    <text x="1195" y="546" text-anchor="middle" font-size="24" font-weight="700" fill="#116B66">STRICT COMPUTATIONAL NEGATIVE PATH</text>
    <text class="body" x="915" y="605">1. Enumerate transcript-oriented C centers in exon unions</text>
    <text class="body" x="915" y="641">2. Require usable depth ≥ 20 in all six replicates</text>
    <text class="body" x="915" y="677">3. Require target ALT count = 0 in all six replicates</text>
    <text class="body" x="915" y="713">4. Exclude every broad candidate and all positive definitions</text>
    <rect x="1005" y="742" width="380" height="42" rx="21" fill="#168983"/>
    <text x="1195" y="769" text-anchor="middle" class="white" font-size="20" font-weight="700">2,821,734 strict negatives</text>
  </g>

  <path d="M405 800 V838 H800" stroke="#526B7F" stroke-width="3" fill="none"/>
  <path d="M1195 800 V838 H800" stroke="#526B7F" stroke-width="3" fill="none"/>
  <path class="arrow" d="M800 838 V860"/>
  <rect x="260" y="868" width="1080" height="72" rx="20" fill="#EAF2F8" stroke="#2878A7" stroke-width="2.5"/>
  <text x="800" y="897" text-anchor="middle" class="heading">Group before splitting</text>
  <text x="800" y="924" text-anchor="middle" class="body">same gene • same genomic center • overlapping window • exact sequence → one leakage group</text>

  <text x="70" y="966" class="small">External basewise mappability was unavailable and is recorded as NA_RESOURCE_MISSING; low-complexity filtering is not presented as an equivalent substitute.</text>
</svg>
